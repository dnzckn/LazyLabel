name: Release zips

# DEPLOYABILITY.md R11: LazyLabel web with nothing to install. Each zip holds a portable Node from
# nodejs.org, checked against its SHASUMS256.txt, the built app and a double-click launcher. sharp's
# image library is native, so there is one zip per OS and architecture. The building is
# modernized/scripts/build-release.mjs and the proof is scripts/release-smoke.mjs: the same two
# scripts a maintainer runs locally.
#
# DEPLOYABILITY.md R12, the AI bundle: the same zip with the AI tools in it -- a portable CPython with
# inference/uv.lock's packages, and SAM 2.1 large and MobileNetV3 fetched and verified by
# lazylabel-models -- split by scripts/pack_parts.py into parts under GitHub's 2 GiB per file, which
# the launcher joins on its first start. PyTorch's CUDA build on Windows and Linux, which runs on the
# processor where there is no NVIDIA card, and its CPU build on macOS, which has no CUDA.
#
# How each trigger behaves from main-web, which is not the default branch:
#   - Pushing a tag web-v<version> on a main-web commit builds and proves the zips and publishes
#     them as a GitHub Release. A tag push runs the workflow file of the tagged commit.
#   - A push to main-web that changes the release tooling, the launcher or the dependencies builds
#     and proves the zips without publishing, so a broken release is found before a tag needs it.
#   - workflow_dispatch is here for the day this file is on the default branch: GitHub offers it
#     only for workflows there, so from main-web alone it never fires. `schedule` has the same
#     limit and is left out.
on:
  push:
    tags: ["web-v*"]
    branches: [main-web]
    paths:
      - .github/workflows/release.yml
      - modernized/scripts/build-release.mjs
      - modernized/scripts/release-smoke.mjs
      - modernized/package-lock.json
      - modernized/lazylabel-reimagined/api/src/cli.ts
      - modernized/lazylabel-reimagined/api/src/launcher.ts
      - modernized/lazylabel-reimagined/api/src/folderDialog.ts
      - modernized/lazylabel-reimagined/api/src/bundle.ts
      - modernized/scripts/pack_parts.py
      - modernized/scripts/nvidia-files.mjs
      - modernized/lazylabel-reimagined/inference/pyproject.toml
      - modernized/lazylabel-reimagined/inference/uv.lock
      - modernized/lazylabel-reimagined/inference/models/manifest.verified.json
  workflow_dispatch:

permissions:
  contents: read

# SEC-11: every action is pinned to a commit, with its release in a comment; modernized.yml says how
# to move one. upload-artifact and download-artifact were resolved on 2026-09-27 with
#   git ls-remote --tags https://github.com/actions/<action>

jobs:
  zip:
    name: zip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # x64
          - os: macos-latest # arm64, Apple silicon
          - os: ubuntu-latest # x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Node that builds the app is the Node the zip ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modernized/package-lock.json

      # npm ci, then npm prune --omit=dev, in a copy of modernized/; the portable Node, checked
      # against nodejs.org's SHASUMS256.txt; the launcher; the zip and its .sha256.
      - name: Build the zip
        run: node modernized/scripts/build-release.mjs --out "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/work"

      # Unzipped into a scratch folder and started through its launcher with no folder, as a
      # double-click starts it; the folder of images is then opened as the app's Open Image Folder
      # opens it, by its path. The web app, /api/health, the image list and a thumbnail (the zip's
      # own sharp) must answer.
      - name: Unzip it and start it, as a user would
        run: node modernized/scripts/release-smoke.mjs "$RUNNER_TEMP/release" --dir "$RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zip-${{ matrix.os }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # Already a zip.
          compression-level: 0

  ai-zip:
    name: AI bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # x64
            torch: cu128
          - os: macos-latest # arm64: no CUDA
            torch: cpu
          - os: ubuntu-latest # x64
            torch: cu128
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # PyTorch's CUDA build is gigabytes, installed once and unpacked again by the smoke test's
      # launcher; Ubuntu's runner has that room only without the SDKs it comes with.
      - name: Make room
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modernized/package-lock.json

      # uv brings the bundle's CPython and installs uv.lock's packages into it: the uv that wrote
      # uv.lock, pinned as modernized.yml pins it. Its cache goes on the runner's working disk.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --quiet uv==0.7.13
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - name: Build the AI bundle
        run: node modernized/scripts/build-release.mjs --ai ${{ matrix.torch }} --out "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/work"

      - name: Free the build's space
        run: |
          rm -rf "$RUNNER_TEMP/work" "$UV_CACHE_DIR"
          df -h "$RUNNER_TEMP"

      # Part 1 unzipped as a user unzips it, the other parts left beside it for the launcher to
      # find and unpack. Then, once the folder is opened through the app, SAM 2.1 must segment a
      # shape from one click and Find Archetypes must answer. A runner has no GPU: this is the
      # processor path.
      - name: Unzip part 1 and start it, as a user would
        run: node modernized/scripts/release-smoke.mjs "$RUNNER_TEMP/release" --dir "$RUNNER_TEMP/smoke" --ai

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-${{ matrix.os }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          # Gigabytes each: kept long enough to look at or publish, not longer.
          retention-days: 7

  publish:
    name: publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/web-v')
    needs: [zip, ai-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Releases come from main-web: a web-v tag on any other commit publishes nothing.
      - name: Check that the tag is on main-web
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main-web...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "$GITHUB_REF_NAME is not a commit on main-web (compare says $status); nothing is published."
            exit 1
          fi

      # Every zip and every AI part together come to over ten gigabytes.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      # --latest=false: the repository's Latest release stays the desktop app's (v2.0.x).
      #
      # --draft: the release is created for a person to look at and publish, with one click on
      # GitHub's page for it. This step uploads about ten gigabytes, and a public release that stopped
      # half-way would show half the files to everyone; a draft that stopped half-way shows them to
      # nobody. The first release is also the first time this step has run.
      - name: Create the release, as a draft
        run: |
          ls -l release
          cat > notes.md <<'NOTES'
          LazyLabel web, with nothing to install.

          1. Download the zip for your computer: `windows-x64`, `macos-arm64` (Apple silicon) or `linux-x64`.
          2. Unzip it and double-click **Start LazyLabel** (`Start LazyLabel.cmd` on Windows, `Start LazyLabel.command` on macOS; on Linux run `./start-lazylabel.sh` in a terminal).
          3. LazyLabel opens in your browser. Click **Open Image Folder** and choose your folder of images.

          The zips are not signed yet. Windows may ask whether to run the launcher: choose More info, then Run anyway. macOS asks the first time: open System Settings, Privacy & Security, and choose Open Anyway. Each zip's SHA-256 is in the `.sha256` file beside it.

          **With the AI tools** (SAM 2.1 for clicks, boxes and Sequence propagation, and Find Archetypes), and still nothing to install: `LazyLabel-web-ai-<your computer>`. It carries its own Python and the models, so it is large, and for Windows and Linux it comes in parts, since GitHub takes no file of 2 GB. Download every part into one folder, unzip part 1 only, and start LazyLabel from it: the first start finds the other parts and unpacks them. On Windows and Linux it runs on an NVIDIA graphics card when there is one, and on the processor otherwise; a Mac always uses the processor. SAM 1 is not included.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --draft \
            --title "LazyLabel web ${GITHUB_REF_NAME#web-v}" --notes-file notes.md

      # What was uploaded, as an annotation: a job's log needs a signed-in account to read, and a
      # draft is not listed for anyone who is not signed in. The release just made is the newest one;
      # a draft cannot be looked up by its tag name, so it is read from the list, and named in it.
      - name: Say what the draft holds
        # Only reports: the draft is made by the step before, and a failure here must not mark a
        # release that was made as failed.
        continue-on-error: true
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" --jq \
            '.[0] | "\(.tag_name): draft \(.draft), \(.assets | length) files" + (.assets | map("\n\(.name)  \(.size) bytes") | join(""))')
          echo "::notice title=release draft::$(printf '%s' "$assets" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
