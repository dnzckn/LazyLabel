name: Modernized services

# The rebuild lives on main-web (MODERNIZATION_BRIEF.md). The existing tests.yml workflow covers the
# legacy Python app on main and is left alone; this one builds and tests the TypeScript services.
#
# Phase 2 exit criterion 4 requires every service to build and test on every push to main-web. New
# services are added to the matrix as each phase scaffolds them.
on:
  push:
    branches: [main-web]
  pull_request:
    branches: [main-web]
  # So the inference image -- a CUDA build too heavy for every push -- can be exercised
  # deliberately, and weekly so a base-image or dependency change is found before a deployment
  # needs it rather than during one.
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# SEC-11: every action is pinned to a COMMIT, with its release in a comment. A tag can be moved to
# different code by whoever controls the action's repository; a commit cannot. Resolved on
# 2026-09-23 from what each major tag pointed to then, with
#   git ls-remote --tags https://github.com/<owner>/<action>
# which is also how to move one forward: find the release's commit, change both the SHA and the
# comment. Nothing updates these automatically -- Dependabot would, and enabling it is the owner's
# call, because it opens pull requests on its own.

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: annotation format library
            path: modernized/lazylabel/core/exporters
          - service: settings schema
            path: modernized/lazylabel-reimagined/settings-schema
          - service: contracts
            path: modernized/lazylabel-reimagined/contracts
          # The API depends on both libraries through file: dependencies, and resolves them to their
          # TypeScript SOURCE via the "development" export condition, so there is no build ordering
          # between them and no chance of testing against a stale dist.
          - service: api
            path: modernized/lazylabel-reimagined/api
          - service: web app
            path: modernized/lazylabel-reimagined/web

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      # The API and the web app reach the libraries' SOURCE through file: links, and a library's own
      # imports resolve from ITS folder, not from the app's. contracts imports the format library, so
      # contracts needs its own install or tsc cannot find it from there. Every package is installed
      # on a developer's machine, which is how this passed everywhere except a fresh checkout.
      - name: Install the linked libraries
        if: matrix.service == 'api' || matrix.service == 'web app'
        run: |
          for lib in ../../lazylabel/core/exporters ../settings-schema ../contracts; do
            (cd "$lib" && npm ci)
          done

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  inference:
    name: inference service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/lazylabel-reimagined/inference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The legacy snapshot is an older commit, so the shallow default cannot reach it.
          fetch-depth: 0
      # test_windows.py runs legacy's own windowing loop, lifted from its source by AST, and skips
      # all 110 of its differentials when the snapshot is absent -- which it was here, so a green run
      # said nothing about them while the file's own docstring said they ran on every commit.
      - name: Check out the legacy snapshot
        working-directory: .
        run: git worktree add --detach legacy/lazylabel 2a7d5d8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      # No [ai] extra, on purpose: PyTorch is gigabytes, and every test that needs it also needs a
      # checkpoint CI does not have, so those skip and say why. Everything else runs -- including
      # SEC-02's decoder allow-list, which needs OpenCV. It is installed here rather than declared by
      # the package, because its two distributions conflict (pyproject.toml says more).
      - name: Install
        run: python -m pip install --quiet -e ".[dev]" opencv-python-headless
      - name: Test
        run: python -m pytest -q

  # Phase 4 entry criterion 3: the LIVE image-load path has characterization tests. They pin down
  # what the legacy code does today, defects included, so the rewrite can be compared against
  # something. tests.yml runs the legacy suite on main only, so they would not run here otherwise --
  # and a gate that does not run is not a gate.
  characterization:
    name: legacy characterization
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # The legacy package is imported from source rather than installed, since installing it pulls
      # its whole dependency tree, PyTorch included, to run one file. Without this the import failed
      # on a clean runner: tests/conftest.py puts the repository ROOT on the path, not src.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      # scipy because importing the legacy UI package imports its FFT widget. Found by running this
      # job's exact installs in a fresh venv, 2026-09-23: 13 passed once both were in place.
      - name: Install
        run: |
          python -m pip install --quiet numpy scipy opencv-python-headless PyQt6 pytest pytest-qt
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
      - name: Characterize the live image-load path
        run: python -m pytest tests/unit/ui/managers/test_file_navigation_load_by_path.py -q

  converter:
    name: alias converter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized/lazylabel-reimagined/converter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      # The suite converts the Phase 1 goldens, which are real legacy output, and proves that a
      # hostile pickle is refused rather than executed.
      - name: Test
        run: python -m pytest -q

  analysis:
    name: analysis documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      # Every rule id cited in an analysis document must exist, and every P0 rule must have a home.
      # The first draft of the Phase 2 spec mis-cited about half its rules and cited one that does
      # not exist; a downstream agent turns those ids into tests mechanically.
      - name: Check rule citations
        working-directory: analysis/lazylabel/pipeline
        run: python check_citations.py

  # The differential suites compare against the legacy Python implementation, which needs the legacy
  # package and its dependencies. They are the strongest proof the port is equivalent, so they run
  # here rather than only on the maintainer's machine.
  differential:
    name: differential against legacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The legacy snapshot is an older commit, so the shallow default cannot reach it.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modernized/lazylabel/core/exporters/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Check out the legacy snapshot
        id: legacy
        run: |
          # legacy/lazylabel is a gitignored worktree on the maintainer's machine, so CI materializes
          # the same snapshot from the commit the analysis pinned.
          git worktree add --detach legacy/lazylabel 2a7d5d8
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        # PyQt6 is needed only because the legacy SegmentManager imports QPointF; QtCore works
        # headless, so no display server is required.
        run: python -m pip install --quiet numpy opencv-python-headless PyQt6

      - name: Install Node dependencies
        working-directory: modernized/lazylabel/core/exporters
        run: npm ci

      - name: Emit port output
        working-directory: modernized/lazylabel/core/exporters
        run: npm run test:differential

      - name: Compare archives with NumPy, and prove the legacy app still reads them
        working-directory: modernized/lazylabel/core/exporters
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy/lazylabel/src
        run: python tools/compare_npz.py .differential

      - name: Compare readers against the legacy loaders
        working-directory: modernized/lazylabel/core/exporters
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy/lazylabel/src
        run: python tools/compare_readers.py .differential/read

  # Phase 6's deployment. Everything under `deploy/` was written on a machine with no Docker, so it
  # was reasoned rather than observed -- and an unbuilt Dockerfile is a plan. This job is what turns
  # that into a fact on every push: a runner here HAS Docker, so the images either build or CI goes
  # red with the reason.
  #
  # It BUILDS and does not RUN. Running the stack needs a dataset to mount and, for the AI profile,
  # a GPU and a multi-gigabyte checkpoint that SEC-03 forbids downloading. Building is the half that
  # can be honest here, and it is the half that catches a bad COPY path, a missing base image or a
  # dependency that will not resolve.
  deployment:
    name: deployment images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Checked on 2026-09-20: setup-buildx is on v4 (4.4.1) and build-push on v7 (7.4.0), so the
      # versions first written here -- v3 and v6 -- were each a major behind. v7's breaking changes
      # are a Node 24 runtime (needing Actions Runner 2.327.1+, which hosted runners have), two
      # deprecated env vars this workflow does not set, and the legacy build-summary tool. None of
      # `context`, `file`, `push`, `load`, `cache-from` or `cache-to` changed. Buildx is used with
      # no inputs at all, which is the lowest-risk usage there is.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The context is `modernized/`, not the rebuild directory: both Node images depend on the
      # exporters package, which is a SIBLING of the rebuild, and Docker refuses COPY paths outside
      # the context.
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: modernized
          file: modernized/lazylabel-reimagined/deploy/api.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: modernized
          file: modernized/lazylabel-reimagined/deploy/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The inference image is the one most likely to break -- it installs PyTorch against a CUDA
      # base -- and it is also multi-gigabyte. Built on a schedule and on demand rather than on
      # every push, so a two-line change to the web app does not pull a CUDA runtime.
      - name: Build the inference image
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: modernized
          file: modernized/lazylabel-reimagined/deploy/inference.Dockerfile
          push: false
          load: false

      # A compose file that parses is not a compose file that works, but one that does NOT parse is
      # a certainty, and this catches it in a second.
      # `example.env` supplies the two required variables, so this also checks that the example
      # stays complete -- a committed example missing a variable the compose file demands is a
      # first-run failure for everyone who copies it.
      - name: Validate the compose file
        working-directory: modernized/lazylabel-reimagined/deploy
        run: docker compose --env-file example.env config --quiet
