name: Modernized services

# The rebuild lives on main-web (MODERNIZATION_BRIEF.md). The existing tests.yml workflow covers the
# legacy Python app on main and is left alone; this one builds and tests the TypeScript services.
#
# Phase 2 exit criterion 4 requires every service to build and test on every push to main-web. New
# services are added to the matrix as each phase scaffolds them.
on:
  push:
    branches: [main-web]
  pull_request:
    branches: [main-web]

permissions:
  contents: read

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: annotation format library
            path: modernized/lazylabel/core/exporters
          - service: settings schema
            path: modernized/lazylabel-reimagined/settings-schema
          - service: contracts
            path: modernized/lazylabel-reimagined/contracts
          # The API depends on both libraries through file: dependencies, and resolves them to their
          # TypeScript SOURCE via the "development" export condition, so there is no build ordering
          # between them and no chance of testing against a stale dist.
          - service: api
            path: modernized/lazylabel-reimagined/api
          - service: web app
            path: modernized/lazylabel-reimagined/web

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  analysis:
    name: analysis documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Every rule id cited in an analysis document must exist, and every P0 rule must have a home.
      # The first draft of the Phase 2 spec mis-cited about half its rules and cited one that does
      # not exist; a downstream agent turns those ids into tests mechanically.
      - name: Check rule citations
        working-directory: analysis/lazylabel/pipeline
        run: python check_citations.py

  # The differential suites compare against the legacy Python implementation, which needs the legacy
  # package and its dependencies. They are the strongest proof the port is equivalent, so they run
  # here rather than only on the maintainer's machine.
  differential:
    name: differential against legacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The legacy snapshot is an older commit, so the shallow default cannot reach it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modernized/lazylabel/core/exporters/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check out the legacy snapshot
        id: legacy
        run: |
          # legacy/lazylabel is a gitignored worktree on the maintainer's machine, so CI materializes
          # the same snapshot from the commit the analysis pinned.
          git worktree add --detach legacy/lazylabel 2a7d5d8
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        # PyQt6 is needed only because the legacy SegmentManager imports QPointF; QtCore works
        # headless, so no display server is required.
        run: python -m pip install --quiet numpy opencv-python-headless PyQt6

      - name: Install Node dependencies
        working-directory: modernized/lazylabel/core/exporters
        run: npm ci

      - name: Emit port output
        working-directory: modernized/lazylabel/core/exporters
        run: npm run test:differential

      - name: Compare archives with NumPy, and prove the legacy app still reads them
        working-directory: modernized/lazylabel/core/exporters
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy/lazylabel/src
        run: python tools/compare_npz.py .differential

      - name: Compare readers against the legacy loaders
        working-directory: modernized/lazylabel/core/exporters
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy/lazylabel/src
        run: python tools/compare_readers.py .differential/read
