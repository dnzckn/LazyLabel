[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazylabel-inference"
version = "0.1.0"
description = "SAM 1 and SAM 2.1 prompts, propagation jobs and archetype finding for LazyLabel web."
requires-python = ">=3.10"
# Deliberately empty. The scaffold runs on the standard library alone, so its tests need neither
# PyTorch nor a model checkpoint and CI stays measured in seconds. Phase 3 adds the model stack
# under the [ai] extra below, and nothing outside models/ will import it directly.
dependencies = []

[project.optional-dependencies]
# Phase 3. Pinned then, not now: a version pinned before the code exists is a guess that ages.
ai = [
    # RULE-084's floor, which is doing security work as well as feature work: segment-anything's
    # build_sam calls plain torch.load with no weights_only, so it is safe only because PyTorch 2.6
    # changed that default. assert_weights_only_loading() is what keeps that checked.
    "torch>=2.7.1",
    "segment-anything",
    # Find Archetypes: MobileNetV3-small for the features, HDBSCAN for the clustering, Pillow for
    # the transform chain. sklearn 1.3 is where HDBSCAN moved into sklearn.cluster.
    "torchvision",
    "scikit-learn>=1.3",
    "pillow",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
