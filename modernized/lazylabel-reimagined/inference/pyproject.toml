[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazylabel-inference"
version = "0.1.0"
description = "SAM 1 and SAM 2.1 prompts, propagation jobs and archetype finding for LazyLabel web."
requires-python = ">=3.10"
# The service starts on the standard library alone, so /health and /models answer on a machine with
# nothing installed and can say what is missing. Every route that reads an image needs numpy and
# OpenCV too, and this said "deliberately empty" long after that stopped being true: a fresh CI
# environment could not even collect the suite.
#
# OpenCV is NOT declared, on purpose. It ships as two distributions, opencv-python and
# opencv-python-headless, that install the same cv2 package; declaring either puts a second copy
# beside an environment's existing one, and removing either later breaks both. A machine that runs
# the desktop app already has opencv-python. The image and CI install the headless build explicitly.
dependencies = ["numpy"]

[project.optional-dependencies]
# Phase 3. Pinned then, not now: a version pinned before the code exists is a guess that ages.
ai = [
    # RULE-084's floor, which is doing security work as well as feature work: segment-anything's
    # build_sam calls plain torch.load with no weights_only, so it is safe only because PyTorch 2.6
    # changed that default. assert_weights_only_loading() is what keeps that checked.
    "torch>=2.7.1",
    "segment-anything",
    # Find Archetypes: MobileNetV3-small for the features, HDBSCAN for the clustering, Pillow for
    # the transform chain. sklearn 1.3 is where HDBSCAN moved into sklearn.cluster.
    "torchvision",
    "scikit-learn>=1.3",
    "pillow",
]
# Pillow builds the PNGs the decoder allow-list tests feed the service (SEC-02).
dev = ["pytest>=8", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
