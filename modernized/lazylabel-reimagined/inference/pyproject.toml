[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazylabel-inference"
version = "0.1.0"
description = "SAM 1 and SAM 2.1 prompts, propagation jobs and archetype finding for LazyLabel web."
# SEC-08: CPython 3.10 reaches end of life in October 2026, and the 3.10 builds this ran on carried
# the expat and OpenSSL versions SEC-08 names. Raised on 2026-09-23 after every suite passed on
# CPython 3.12.11 with PyTorch 2.10.0, in a venv of its own (`E:\venv\lazylabel-312`).
requires-python = ">=3.12"
# The service starts on the standard library alone, so /health and /models answer on a machine with
# nothing installed and can say what is missing. Every route that reads an image needs numpy and
# OpenCV too, and this said "deliberately empty" long after that stopped being true: a fresh CI
# environment could not even collect the suite.
#
# OpenCV is NOT declared, on purpose. It ships as two distributions, opencv-python and
# opencv-python-headless, that install the same cv2 package; declaring either puts a second copy
# beside an environment's existing one, and removing either later breaks both. A machine that runs
# the desktop app already has opencv-python. The image and CI install the headless build explicitly.
dependencies = ["numpy"]

[project.optional-dependencies]
# Phase 3. Pinned then, not now: a version pinned before the code exists is a guess that ages.
ai = [
    # RULE-084's floor, which is doing security work as well as feature work: segment-anything's
    # build_sam calls plain torch.load with no weights_only, so it is safe only because PyTorch 2.6
    # changed that default. assert_weights_only_loading() is what keeps that checked.
    #
    # 2.10.0 since 2026-09-23: the version every suite passed on under CPython 3.12. Two things
    # were learned doing so, and both are in `tests/conftest.py`: PyTorch 2.10 cannot load its
    # DLLs on Windows once PyQt6 6.9 is loaded, and it keeps more GPU memory between test modules
    # than 2.7.1 did. SAM 2's masks also move slightly with the PyTorch version where the model is
    # unsure, which is why the propagation golden records the one it was captured on.
    "torch>=2.10.0",
    # SEC-12: pinned to exactly what every differential suite ran against, read from this
    # environment's install records on 2026-09-23. segment-anything has one release. SAM 2 is not on
    # PyPI, and was NOT DECLARED AT ALL until then -- so an install of this extra, the image's
    # included, could not load a SAM 2 model. It is named by commit: a branch would move, and the
    # masks with it, under a suite that still passed.
    "segment-anything==1.0",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    # Find Archetypes: MobileNetV3-small for the features, HDBSCAN for the clustering, Pillow for
    # the transform chain. sklearn 1.3 is where HDBSCAN moved into sklearn.cluster.
    "torchvision",
    "scikit-learn>=1.3",
    "pillow",
]
# Pillow builds the PNGs the decoder allow-list tests feed the service (SEC-02).
dev = ["pytest>=8", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
