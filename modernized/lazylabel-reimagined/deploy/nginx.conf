# One origin for the browser: the app and its API.
#
# The web app defaults its API base to `/api` (`web/src/main.tsx`), which is a same-origin relative
# path rather than an absolute URL. That default is the design, not an accident, and following it
# here buys three things:
#
#   - NO CORS. The API has no CORS handling and needs none, because nothing ever asks it
#     cross-origin. Adding CORS to make a second origin work would be adding a header whose whole
#     job is to permit something this deployment does not need to do.
#   - NO BAKED ADDRESS. A static bundle has no environment to read at runtime, so an absolute API
#     URL would have to be compiled in — and moving the deployment would mean rebuilding the image.
#     A relative path moves with it.
#   - ONE PUBLISHED PORT. The API is not exposed to the host at all; only this server is. There is
#     no authentication in this app by design (decision 3), so every port that does not need to
#     exist is one that cannot be reached.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Annotation masks are large and compress well. The image pixels do not — they are already PNG
    # — so the types are listed rather than gzipping everything.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    location / {
        # A static bundle with no client-side routing today. `try_files` is here so that adding
        # routes later does not turn every deep link into a 404 on refresh.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # The trailing slashes on both sides matter: they strip `/api` before proxying, so the API
        # sees `/projects/...` exactly as it does when run directly. Without them every route would
        # arrive as `/api/projects/...` and 404.
        proxy_pass http://api:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold SAM encode is seconds and a propagation job is longer. The default 60s read
        # timeout would cancel the first click on every image, which reads as the AI being broken.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Uploads are not chunked through a buffer: an image can be tens of megabytes and buffering
        # it twice is latency for nothing.
        proxy_request_buffering off;
        client_max_body_size 512m;
    }
}
